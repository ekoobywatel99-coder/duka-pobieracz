name: pobierz-m1
on:
  workflow_dispatch:
    inputs:
      symbol: {description: symbol, default: USATECHIDXUSD}
      od: {description: od RRRR-MM, default: "2024-01"}
      do: {description: do RRRR-MM, default: "2024-01"}
jobs:
  pobierz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: curl -s https://ifconfig.me; echo
      - run: python3 tools/pc_duka_raw.py work ${{ inputs.symbol }} --od=${{ inputs.od }} --do=${{ inputs.do }} --watki=4
      - if: always()
        run: find work/chunks -type f | wc -l; du -sh work
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.symbol }}_${{ inputs.od }}_${{ inputs.do }}
          path: work/chunks
          retention-days: 7
